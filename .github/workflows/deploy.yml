name: Astro CI (Bun)

on:
  push:
    branches: [ "main" ]

# Memberikan izin yang dibutuhkan oleh GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Memastikan hanya satu proses deploy yang berjalan dalam satu waktu
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repositori
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Bun environment
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. Install dependensi
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 4. Cek error sintaks / TypeScript
      - name: Astro Check
        run: bunx astro check

      # 5. Build proyek Astro
      - name: Build Astro site
        run: bun run build

      # 6. Upload hasil build (folder dist) sebagai artefak Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 7. Deploy ke GitHub Pages secara langsung
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4