name: Astro CI (Bun)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repositori
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Bun environment
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. Install dependensi (menggunakan bun install)
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 4. Cek error sintaks / TypeScript 
      - name: Astro Check
        run: bunx astro check

      # 5. Build proyek Astro
      - name: Build Astro site
        run: bun run build

        # 6. Push folder dist ke branch "deploy" (Hanya saat push ke main)
      - name: Deploy dist to deploy branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true